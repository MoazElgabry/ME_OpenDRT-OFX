name: Update Plugin Manager Manifest

on:
  workflow_dispatch:
  release:
    types:
      - published
      - edited

concurrency:
  group: update-plugin-manager-manifest-${{ github.event.release.id || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-manager-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v5

      - name: Checkout manager repo
        uses: actions/checkout@v5
        with:
          repository: MoazElgabry/Moaz-Elgabry-plugins
          path: manager-repo
          token: ${{ secrets.MEPM_MANAGER_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Download published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > plugin-releases.json

      - name: Regenerate manager manifests
        run: |
          node manager-repo/tools/generate-plugin-channel-manifests.mjs \
            --manager-root manager-repo \
            --config manager-release-config.json \
            --releases-json plugin-releases.json

      - name: Create manager manifest PR
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MEPM_MANAGER_REPO_TOKEN }}
          path: manager-repo
          commit-message: "Update plugin manifests for ME_OpenDRT"
          branch: "automation/me-opendrt-manifests"
          delete-branch: true
          title: "Update plugin manifests for ME_OpenDRT"
          body: |
            Regenerated manager manifests from published releases in
            `MoazElgabry/ME_OpenDRT-OFX`.

            Trigger: `${{ github.event_name }}`
            Release: `${{ github.event.release.tag_name || 'manual-run' }}`

      - name: Merge or enable auto-merge for manager manifest PR
        if: ${{ steps.create_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.MEPM_MANAGER_REPO_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.create_pr.outputs.pull-request-number }}"
          repo="MoazElgabry/Moaz-Elgabry-plugins"
          pr_url="$(gh pr view "${pr_number}" --repo "${repo}" --json url --jq .url)"

          # A newly-created PR commonly reports UNKNOWN briefly while GitHub
          # calculates mergeability. Do not mistake that transient state for
          # a branch-policy requirement.
          mergeable="UNKNOWN"
          merge_state="UNKNOWN"
          for attempt in $(seq 1 12); do
            pr_state="$(gh pr view "${pr_number}" --repo "${repo}" \
              --json mergeable,mergeStateStatus \
              --jq '[.mergeable, .mergeStateStatus] | @tsv')"
            IFS=$'\t' read -r mergeable merge_state <<< "${pr_state}"
            echo "Mergeability attempt ${attempt}: mergeable=${mergeable}, state=${merge_state}"

            if [ "${mergeable}" != "UNKNOWN" ]; then
              break
            fi
            sleep 5
          done

          if [ "${mergeable}" = "UNKNOWN" ]; then
            echo "::error::GitHub did not resolve PR mergeability in time: ${pr_url}"
            exit 1
          fi

          if [ "${mergeable}" = "CONFLICTING" ] || [ "${merge_state}" = "DIRTY" ]; then
            echo "::error::Manager manifest PR has merge conflicts: ${pr_url}"
            exit 1
          fi

          # Direct merge is correct for repositories without protected-branch
          # requirements. If branch policy blocks it, auto-merge is the
          # appropriate fallback and GitHub will merge only after requirements pass.
          if ! gh pr merge "${pr_number}" --repo "${repo}" --squash --delete-branch; then
            echo "Direct merge was blocked; attempting protected-branch auto-merge."
            if ! gh pr merge "${pr_number}" --repo "${repo}" --auto --squash --delete-branch; then
              echo "::error::Neither direct merge nor auto-merge was accepted: ${pr_url}"
              exit 1
            fi
          fi

          final_state="$(gh pr view "${pr_number}" --repo "${repo}" --json state,autoMergeRequest \
            --jq 'if .state == "MERGED" then "merged" elif .autoMergeRequest != null then "auto-merge-enabled" else .state end')"
          echo "Manager manifest PR result: ${final_state} (${pr_url})"

          if [ "${final_state}" != "merged" ] && [ "${final_state}" != "auto-merge-enabled" ]; then
            echo "::error::Manager manifest PR was left in an unexpected state: ${final_state} (${pr_url})"
            exit 1
          fi
